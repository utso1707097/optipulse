name: optipulse_app
description: >
  OptiPulse Mobile App — offline-first ops app for Admin & DevOps: real-time
  telemetry, push notifications, instant kill-switch. iOS + Android only.
publish_to: 'none'
version: 0.1.0

environment:
  # Dart 3.12 is the floor: injectable_generator 3.1.x and build_runner 2.15.x both
  # require it. Flutter 3.44.2 ships Dart 3.12.2; CI pins that exact version so a
  # channel bump cannot silently change what the toolchain resolves.
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (Constitution Principle V — BLoC/Cubit only, no Riverpod/Provider-as-state)
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.1.0

  # Networking (Constitution Principle V — Dio behind a repository)
  dio: ^5.11.0

  # DI (constructor injection; get_it as the service locator, not for app state)
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Offline persistence backing store for HydratedBloc
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  injectable_generator: ^3.1.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Scaffolded with:
#   flutter create . --platforms=ios,android --org com.optipulse --project-name optipulse_app
# Every version above was resolved by the toolchain, not assumed (T005).
