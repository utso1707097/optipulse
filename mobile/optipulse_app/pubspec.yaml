name: optipulse_app
description: >
  OptiPulse Mobile App — offline-first ops app for Admin & DevOps: real-time
  telemetry, push notifications, instant kill-switch. iOS + Android only.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (Constitution Principle V — BLoC/Cubit only, no Riverpod/Provider-as-state)
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.1.0

  # Networking (Constitution Principle V — Dio behind a repository)
  dio: ^5.11.0

  # DI (constructor injection; get_it as the service locator, not for app state)
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Offline persistence backing store for HydratedBloc
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  build_runner: ^2.16.0
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true

# NOTE: This pubspec.yaml is hand-authored (Flutter SDK is not installed in this
# environment, so `flutter create` / `flutter pub get` could not be run). Versions
# above were verified against pub.dev at authoring time. Before first use, run:
#   flutter create . --platforms=ios,android --org com.optipulse
#   flutter pub get
#   flutter analyze
# and resolve anything the Flutter toolchain flags. See T005 in tasks.md.
