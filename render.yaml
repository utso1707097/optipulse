# Render Blueprint — one-click deploy.
#
# Render creates the database, the key-value store and the API together, and injects the
# connection strings itself, so there is nothing to copy between dashboards. The API accepts the
# `postgres://` and `redis://` URLs Render injects natively (see ConnectionStringNormalizer),
# which is what makes that possible.
#
# You supply exactly FIVE values, once, when prompted: two bootstrap emails, two passwords, and
# your dashboard's origin. Everything else is derived.
#
# ⚠️ TRADE-OFF, read before relying on this: Render's FREE PostgreSQL has historically been
# removed after a trial window, which would take the audit trail and every flag with it. That is
# fine for a portfolio demo and NOT fine for anything you care about. To keep the data, point
# ConnectionStrings__* at Neon instead and delete the `databases:` block below.

databases:
  - name: optipulse-postgres
    plan: free
    databaseName: optipulse
    user: optipulse

services:
  - type: keyvalue
    name: optipulse-redis
    plan: free
    region: frankfurt
    # Empty allow-list = reachable only from inside this Render account's private network,
    # which is where the API runs. Redis carries invalidation messages and needs no public access.
    ipAllowList: []

  - type: web
    name: optipulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt

    # Liveness, not readiness: readiness checks the database, and a database blip would then make
    # the platform kill a container that is correctly serving last-known-good evaluations.
    healthCheckPath: /health/live

    # CI triggers deploys after every gate passes, so a raw push never deploys on its own.
    autoDeploy: false

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Postgres
      - key: Database__SchemaStrategy
        value: Migrate

      # Injected by Render — the three contexts share one physical database by design.
      - key: ConnectionStrings__Flags
        fromDatabase:
          name: optipulse-postgres
          property: connectionString
      - key: ConnectionStrings__Audit
        fromDatabase:
          name: optipulse-postgres
          property: connectionString
      - key: ConnectionStrings__Identity
        fromDatabase:
          name: optipulse-postgres
          property: connectionString

      - key: Redis__ConnectionString
        fromService:
          name: optipulse-redis
          type: keyvalue
          property: connectionString

      # Generated by Render, never seen by anyone, never committed. Rotating it invalidates all
      # issued tokens, which is the correct behaviour for a signing key.
      - key: Jwt__SigningKey
        generateValue: true

      # The five you are prompted for. `sync: false` means "ask me, do not store in git".
      - key: Bootstrap__Manager__Email
        sync: false
      - key: Bootstrap__Manager__Password
        sync: false
      - key: Bootstrap__Admin__Email
        sync: false
      - key: Bootstrap__Admin__Password
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
