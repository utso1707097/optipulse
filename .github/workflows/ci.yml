name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Works out which stacks a change actually touches, so a docs-only or Flutter-only push does
  # not pay for a .NET build, a Testcontainers suite and a Docker image.
  #
  # WHY THIS IS A JOB AND NOT `on.push.paths`. Workflow-level path filters would be simpler and
  # would break merging: when a filter excludes a run, the check is never CREATED, and a branch
  # rule that requires "Backend (.NET 10)" then waits forever for a result that will never
  # arrive. A job SKIPPED by an `if:` does report a conclusion, and GitHub counts a skipped
  # required check as satisfied. The filtering therefore has to live on the jobs.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Written out in full rather than composed with YAML anchors. A few repeated globs
          # are cheaper than a merge-blocking gate whose scope has to be worked out by
          # resolving aliases.
          #
          # Every filter includes the workflow directory: a change to CI itself must run
          # everything, because the change to be validated IS the pipeline.
          filters: |
            backend:
              - '.github/workflows/**'
              - 'backend/**'
              - 'contracts-gen/**'
              - 'openapitools.json'
            web:
              - '.github/workflows/**'
              - 'web/**'
            mobile:
              - '.github/workflows/**'
              - 'mobile/**'
            contracts:
              - '.github/workflows/**'
              - 'backend/**'
              - 'contracts-gen/**'
              - 'openapitools.json'
              # The gate diffs the spec against BOTH generated clients, so editing a client's
              # generated tree is as much a drift risk as changing the API.
              - 'web/optipulse_dashboard/src/api/**'
              - 'mobile/optipulse_app/lib/core/generated/**'

  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Anti-pattern gate
        run: bash scripts/check-antipatterns.sh

      - name: Restore
        run: dotnet restore

      # Constitution Principle III — warnings (incl. AOT/trim) are build errors.
      - name: Build (warnings as errors)
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build --verbosity normal

      # T097 — the deployable artifact is built on every PR. A Dockerfile that nothing
      # exercises rots silently, and the first person to discover it is whoever is trying
      # to deploy (constitution v2.3.0).
      - name: Build container image
        run: docker build -t optipulse-api:ci .

      # Constitution Principle II — zero-allocation, sub-5ms evaluation gate.
      - name: Evaluation benchmark gate
        run: dotnet run -c Release --project tests/OptiPulse.Evaluation.Benchmarks --no-launch-profile -- --filter '*' --exporters json
        continue-on-error: false

  contracts-drift:
    name: OpenAPI contract drift gate
    runs-on: ubuntu-latest
    needs: [changes, backend]
    # `always()` because `backend` may legitimately be SKIPPED — a change to only the generated
    # Dart client still needs the gate. Without it, `needs` on a skipped job would skip this one
    # too, and drift could be merged by touching the client alone. The `!failure()` clause keeps
    # a genuinely broken backend from reaching the gate.
    if: |
      always() && !failure() && !cancelled()
      && needs.changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # T094 — the Dart generator must be PRESENT, so the gate covers Flutter rather than
      # silently skipping it (constitution v2.2.0 Principle VII: fail, never skip). It is a
      # Java tool, hence the JDK. generate.sh still exempts Dart only while the Flutter client
      # has no source at all, and switches enforcement on by itself once it does.
      - name: Setup Java (required by openapi-generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install openapi-generator
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Regenerate OpenAPI + clients
        run: bash contracts-gen/generate.sh

      # Constitution Principle VII — any diff here means an endpoint changed
      # without regenerating the spec + both client artifacts.
      - name: Fail on drift
        run: git diff --exit-code -- contracts-gen/ web/optipulse_dashboard/src/api/ mobile/optipulse_app/lib/core/generated/

  web:
    name: Web Dashboard (React)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: web/optipulse_dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/optipulse_dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    name: Mobile App (Flutter)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: mobile/optipulse_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # PINNED, not "stable". The floating channel resolved a Dart older than
          # injectable_generator and build_runner require, so a version that built
          # locally could fail here — or worse, resolve different package versions on
          # each run. 3.44.2 ships Dart 3.12.2, the floor declared in pubspec.yaml.
          flutter-version: "3.44.2"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The Flutter app is still a scaffold until Phase 6 (US4, T063-T077), so
      # `flutter test` fails with "does not appear to contain any test files".
      # Skip ONLY while there is no Dart source at all — the moment any lands,
      # missing tests become a hard failure rather than a silent pass.
      - name: Test
        run: |
          if find lib -name '*.dart' -print -quit | grep -q .; then
            if find test -name '*_test.dart' -print -quit | grep -q .; then
              flutter test
            else
              echo "::error::lib/ contains Dart source but test/ has no *_test.dart files."
              exit 1
            fi
          else
            echo "::notice::Skipping flutter test - lib/ has no Dart source yet (scaffold; see T063-T077)."
          fi

  # ---------------------------------------------------------------------------
  # Continuous deployment. Runs ONLY on a push to main, and ONLY after every gate
  # above has passed — `needs` makes a red build physically unable to deploy,
  # which is the same reasoning as the branch ruleset: a check that cannot block
  # is advice, not a gate.
  #
  # Deployment is skipped rather than failed when its secret is absent, so the
  # repository still builds green for anyone who forks it without a Render or
  # Vercel account.
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy API (Render)
    runs-on: ubuntu-latest
    needs: [changes, backend, contracts-drift, web, mobile]
    # `always() && !failure() && !cancelled()` rather than plain success(): with per-area
    # filtering the gate jobs are routinely SKIPPED, and `needs` treats a skipped dependency as
    # not-satisfied — so an API-only change would skip its own deploy because the web and mobile
    # jobs did not run. The !failure() clause is what still makes this gated: any gate that ran
    # and failed stops the deploy, which is the property that matters.
    if: |
      always() && !failure() && !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.backend == 'true'
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL not set — skipping backend deploy."
            exit 0
          fi
          # Render's hook returns the deploy id; -f makes a non-2xx a failed step rather
          # than a silent no-op that looks deployed.
          curl -fsS -X POST "$HOOK" -o response.json
          echo "Triggered: $(cat response.json)"

      - name: Wait for the new instance to report healthy
        env:
          BASE: ${{ secrets.RENDER_API_BASE_URL }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::notice::RENDER_API_BASE_URL not set — skipping post-deploy health check."
            exit 0
          fi
          # A deploy that starts is not a deploy that works. Poll readiness, which checks the
          # database, so a broken migration or a bad connection string fails the pipeline
          # instead of quietly leaving a dead instance serving 503s.
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health/ready" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after ~$((i * 15))s."
              exit 0
            fi
            echo "attempt $i: /health/ready returned $code"
            sleep 15
          done
          echo "::error::New deployment never reported ready."
          exit 1

  deploy-web:
    name: Deploy Dashboard (Vercel)
    runs-on: ubuntu-latest
    needs: [changes, backend, contracts-drift, web, mobile]
    # See the Render job above for why this is not `success()`.
    if: |
      always() && !failure() && !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.web == 'true'
    environment: production
    # NOTE: this job deliberately runs from the REPOSITORY ROOT, unlike the `web` job above.
    # The Vercel project's own Root Directory setting is `web/optipulse_dashboard`, and
    # `vercel build` applies it relative to the working directory. Running the CLI from inside
    # that same folder applies the prefix twice, so the build looks for
    # web/optipulse_dashboard/web/optipulse_dashboard and fails with UNRESOLVED_ENTRY on
    # index.html. Root here, once there, is the arrangement that resolves correctly.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/optipulse_dashboard/package-lock.json

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Baked in at build time (Vite inlines it), so it must be present HERE, not in
          # Vercel's runtime settings — a static bundle has no runtime env to read.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN not set — skipping dashboard deploy."
            exit 0
          fi
          # `vercel build` runs the project's build command but does NOT install dependencies
          # when it is invoked outside Vercel's own builder, so `vite build` fails with
          # "vite: not found". Install first, deterministically from the lockfile, into the
          # dashboard folder where the build will actually run.
          npm ci --prefix web/optipulse_dashboard
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
